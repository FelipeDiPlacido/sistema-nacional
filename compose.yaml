name: sistema-nacional

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: national
      POSTGRES_USER: national
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - national_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U national -d national"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://national:${POSTGRES_PASSWORD}@postgres:5432/national
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RATE_LIMIT_GLOBAL_REQUESTS_PER_MINUTE: ${RATE_LIMIT_GLOBAL_REQUESTS_PER_MINUTE:-600}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_GLOBAL_LOGIN_PER_MINUTE: ${RATE_LIMIT_GLOBAL_LOGIN_PER_MINUTE:-30}
      RATE_LIMIT_REGISTRATION_PER_HOUR: ${RATE_LIMIT_REGISTRATION_PER_HOUR:-10}
      RATE_LIMIT_GLOBAL_REGISTRATION_PER_HOUR: ${RATE_LIMIT_GLOBAL_REGISTRATION_PER_HOUR:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_COORDINATOR_EMAIL: ${BOOTSTRAP_COORDINATOR_EMAIL:?Set BOOTSTRAP_COORDINATOR_EMAIL in .env}
      BOOTSTRAP_COORDINATOR_PASSWORD: ${BOOTSTRAP_COORDINATOR_PASSWORD:?Set BOOTSTRAP_COORDINATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  national_postgres_data:
