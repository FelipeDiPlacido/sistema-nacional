name: sistema-nacional

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: national
      POSTGRES_USER: national
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - national_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U national -d national"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://national:${POSTGRES_PASSWORD}@postgres:5432/national
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      RESOURCE_ADMIN_TOKEN: ${RESOURCE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  national_postgres_data:
