[project]
name = "sistema-nacional-api"
version = "0.1.0"
description = "Sistema Nacional de Gestión de Recursos y Riesgos API"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.15,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "limits>=5.8,<6",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgresql: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
